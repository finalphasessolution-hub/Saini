<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        /* Top button ke liye styling */
        .top-nav {
            max-width: 1200px;
            margin: 0 auto 20px auto;
        }
        .btn-top {
            background-color: #333333;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn-top:hover {
            background-color: #555555;
        }
        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .thumbnail-box {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
            display: block;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .thumbnail-box:hover .play-overlay {
            opacity: 1;
        }
        .play-btn-icon {
            background-color: #e50914;
            color: white;
            font-size: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 4px;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.8);
        }
        .movie-info {
            padding: 15px;
            text-align: center;
        }
        .movie-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 8px 12px;
            font-size: 14px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-play {
            background-color: #e50914;
            color: white;
        }
        .btn-play:hover {
            background-color: #b20710;
        }
        .btn-download {
            background-color: #2ed573;
            color: white;
        }
        .btn-download:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <!-- Yahan page ke top par button/link diya gaya hai -->
    <div class="top-nav">
        <a href="index.html" class="btn-top">← Back to Home</a>
    </div>

                <img src="movies/hanuman.jpg" alt="Hanuman Ansh">

                    <div class="play-btn-icon">▶</div>

            </a>
            <div class="movie-info">
                <div class="movie-title" title="Hanuman Ansh (2026) Hindi HDTC- 1080P">Hanuman Ansh (2026) Hindi HDTC- 1080P</div>
                <div class="btn-group">
                    <a href="movies/Hanuman Ansh (2026) Hindi HDTC- 1080P.mkv" target="_blank" class="btn btn-play">Play</a>
                    <a href="movies/Hanuman Ansh (2026) Hindi HDTC- 1080P.mkv" download class="btn btn-download">Download</a>

</body>
</html>
