<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Service Booking | Jaspal Singh Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 30px 20px; text-align: center; position: relative; }
        .home-btn { position: absolute; top: 25px; left: 20px; color: white; text-decoration: none; font-weight: bold; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-card h2 { margin-bottom: 20px; color: #1e3c72; font-size: 1.8rem; text-align: center; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .input-group textarea { height: 120px; resize: none; }
        
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .whatsapp-btn:hover { background: #20ba5a; }
    </style>
<style>
:root{--primary:#f39c12;--primary-hover:#d68910;--dark:#0f172a;--bg:#f8fafc;--card:#ffffff;--text:#334155;--border:#e2e8f0}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
header{background:var(--dark);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.logo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo h2{margin:0;color:var(--primary);font-size:20px;font-weight:800}
.badge{background:rgba(243,156,18,.15);color:var(--primary);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(243,156,18,.3)}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav a{color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:600;transition:.2s}
nav a:hover{color:var(--primary)}
.theme-btn{background:#334155;color:#fff;border:none;padding:6px 12px;border-radius:20px;cursor:pointer;font-weight:600}
.section{padding:60px 20px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid var(--border);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.btn{background:var(--primary);color:#000;padding:12px 24px;border-radius:8px;font-weight:800;text-decoration:none;display:inline-block;border:none;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(243,156,18,.4)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.quote-box{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:600px;margin:30px auto;border:1px solid var(--border)}
.quote-box input,.quote-box select,.quote-box textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
footer{background:var(--dark);color:#94a3b8;text-align:center;padding:30px 20px;margin-top:40px}
.footer-nav a{color:#cbd5e1;text-decoration:none;margin:0 10px;font-size:14px}
#chat-widget{position:fixed;bottom:24px;right:24px;z-index:9999}
#chat-btn{width:62px;height:62px;border-radius:50%;background:var(--primary);border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:transform .2s}
#chat-btn:hover{transform:scale(1.08)}
#chat-box{display:none;width:340px;height:460px;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;flex-direction:column;margin-bottom:12px;border:1px solid var(--border)}
#chat-header{background:var(--dark);color:#fff;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.chat-msg{padding:8px 12px;margin:6px 10px;border-radius:10px;max-width:80%;font-size:14px}
.user-msg{background:var(--primary);color:#000;margin-left:auto;text-align:right}
.bot-msg{background:var(--bg);border:1px solid var(--border)}
</style><script>function toggleTheme(){let t=document.documentElement.getAttribute("data-theme");let nt=t==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nt);localStorage.setItem("theme",nt);} let s=localStorage.getItem("theme"); if(s)document.documentElement.setAttribute("data-theme",s);</script></head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <h1><i class="fas fa-headset"></i> Quick Service Booking</h1>
        <p>Connect with Jaspal Singh instantly via WhatsApp</p>
    </header>

    <div class="container">
        <div class="form-card">
            <h2><i class="fab fa-whatsapp" style="color: #25D366;"></i> Book via WhatsApp</h2>
            <div class="input-group">
                <label>Your Full Name:</label>
                <input type="text" id="clientName" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Phone Number:</label>
                <input type="tel" id="clientPhone" placeholder="Enter your mobile number">
            </div>
            <div class="input-group">
                <label>Select Service Required:</label>
                <select id="clientService">
                    <option value="Insurance Policy Enquiry">Insurance Policy (Motor/Health/Term)</option>
                    <option value="SIP & Investment Planning">SIP & Investment Planning</option>
                    <option value="IT Technical Support / Repair">IT Technical Support / PC Repair</option>
                    <option value="General Consultation">General Consultation</option>
                </select>
            </div>
            <div class="input-group">
                <label>Additional Message / Details:</label>
                <textarea id="clientMessage" placeholder="Write your requirement here..."></textarea>
            </div>
            <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                <i class="fab fa-whatsapp fa-lg"></i> Send Enquiry to WhatsApp
            </button>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            let service = document.getElementById('clientService').value;
            let message = document.getElementById('clientMessage').value.trim();

            if(name === "" || phone === "") {
                alert("Please enter your Name and Phone Number!");
                return;
            }

            // Aapka WhatsApp Number yahan set kar diya gaya hai
            let myWhatsAppNumber = "919958037734"; 

            let whatsappText = `Hello Jaspal Singh,%0A%0A*Name:* ${encodeURIComponent(name)}%0A*Phone:* ${encodeURIComponent(phone)}%0A*Service:* ${encodeURIComponent(service)}%0A*Message:* ${encodeURIComponent(message)}`;

            let whatsappURL = `https://wa.me/${myWhatsAppNumber}?text=${whatsappText}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
