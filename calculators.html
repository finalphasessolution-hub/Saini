<!DOCTYPE html>
<html lang="en">
<head>
<script src="animations-loader.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial & Loan Calculators | Jaspal Singh Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 30px 20px; text-align: center; position: relative; }
        .home-btn { position: absolute; top: 25px; left: 20px; color: white; text-decoration: none; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }
        .calc-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .calc-card h2 { margin-bottom: 20px; color: #1e3c72; font-size: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        
        .calc-btn { background: #1e3c72; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .calc-btn:hover { background: #2a5298; }
        
        .result-box { margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 5px solid #1e3c72; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <h1><i class="fas fa-calculator"></i> Financial & Loan Calculators</h1>
        <p>Plan your investments and calculate your EMIs instantly</p>
    </header>

    <div class="container">
        <!-- SIP Calculator -->
        <div class="calc-card">
            <h2><i class="fas fa-chart-line"></i> SIP Return Calculator</h2>
            <div class="input-group">
                <label>Monthly Investment (₹):</label>
                <input type="number" id="sipAmount" value="5000">
            </div>
            <div class="input-group">
                <label>Expected Annual Return Rate (%):</label>
                <input type="number" id="sipRate" value="12">
            </div>
            <div class="input-group">
                <label>Time Period (Years):</label>
                <input type="number" id="sipYears" value="10">
            </div>
            <button class="calc-btn" onclick="calculateSIP()">Calculate SIP</button>
            <div class="result-box" id="sipResult">Enter details and click calculate.</div>
        </div>

        <!-- EMI Calculator -->
        <div class="calc-card">
            <h2><i class="fas fa-university"></i> Loan EMI Calculator</h2>
            <div class="input-group">
                <label>Loan Amount (₹):</label>
                <input type="number" id="loanAmount" value="500000">
            </div>
            <div class="input-group">
                <label>Interest Rate (% P.A.):</label>
                <input type="number" id="loanRate" value="8.5">
            </div>
            <div class="input-group">
                <label>Loan Tenure (Years):</label>
                <input type="number" id="loanYears" value="5">
            </div>
            <button class="calc-btn" onclick="calculateEMI()">Calculate EMI</button>
            <div class="result-box" id="emiResult">Enter details and click calculate.</div>
        </div>
    </div>

    <script>
        function calculateSIP() {
            let p = parseFloat(document.getElementById('sipAmount').value);
            let i = parseFloat(document.getElementById('sipRate').value) / 12 / 100;
            let n = parseFloat(document.getElementById('sipYears').value) * 12;
            
            let maturity = p * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);
            let invested = p * n;
            let gain = maturity - invested;

            document.getElementById('sipResult').innerHTML = `
                <b>Invested Amount:</b> ₹${invested.toFixed(0)}<br>
                <b>Estimated Wealth:</b> ₹${maturity.toFixed(0)}<br>
                <b>Total Wealth Gain:</b> ₹${gain.toFixed(0)}
            `;
        }

        function calculateEMI() {
            let p = parseFloat(document.getElementById('loanAmount').value);
            let r = parseFloat(document.getElementById('loanRate').value) / 12 / 100;
            let n = parseFloat(document.getElementById('loanYears').value) * 12;

            let emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            let totalPayment = emi * n;
            let totalInterest = totalPayment - p;

            document.getElementById('emiResult').innerHTML = `
                <b>Monthly EMI:</b> ₹${emi.toFixed(0)}<br>
                <b>Total Interest:</b> ₹${totalInterest.toFixed(0)}<br>
                <b>Total Payment:</b> ₹${totalPayment.toFixed(0)}
            `;
        }
    </script>
</body>
</html>
